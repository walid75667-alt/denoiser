name: Windows build and processing checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build native engine and test the Windows binding
        shell: pwsh
        run: ./scripts/build.ps1 -RebuildNative -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: MicDenoiser-Windows-x64
          path: artifacts/windows
